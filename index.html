<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
:root {
  color-scheme: dark;
  --cyan: #7df9ff;
  --blue: #3d6dff;
  --violet: #a755ff;
  --pink: #ff4fd8;
  --green: #7cffb2;
}
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  overflow-x: hidden;
  background: #010207;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  min-height: 200dvh;
  overflow-y: auto;
  color: #f8fbff;
  scroll-behavior: smooth;
  --heroFade: 1;
  --shipReveal: 0;
  --shipTiltX: 0deg;
  --shipTiltY: 0deg;
  --shipRoll: 0deg;
  --engineBoost: .55;
}
body::-webkit-scrollbar {
  width: 0;
  height: 0;
}
canvas,
.sweep,
.vignette,
.grid,
.centerpiece,
.copy,
.marquee {
  position: fixed;
  inset: 0;
}
#space {
  z-index: 0;
  display: block;
  width: 100vw;
  height: 100vh;
}
.grid {
  z-index: 1;
  pointer-events: none;
  opacity: .32;
  background:
    linear-gradient(rgba(125,249,255,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,249,255,.08) 1px, transparent 1px);
  background-size: 7.5vmin 7.5vmin;
  mask-image: radial-gradient(circle at center, black 0, black 34%, transparent 74%);
  animation: gridDrift 18s linear infinite;
}
.sweep {
  z-index: 2;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: .92;
  background:
    linear-gradient(105deg, transparent 0%, transparent 28%, rgba(64, 239, 255, .02) 34%, rgba(112, 95, 255, .18) 42%, rgba(255, 87, 216, .1) 48%, transparent 58%, transparent 100%),
    linear-gradient(72deg, transparent 0%, transparent 38%, rgba(124, 255, 178, .16) 44%, rgba(61, 109, 255, .05) 52%, transparent 64%, transparent 100%);
  background-size: 260% 260%, 220% 220%;
  filter: blur(1px) saturate(1.6);
  animation: sweep 7.5s cubic-bezier(.62,0,.38,1) infinite;
}
.sweep::before,
.sweep::after {
  content: "";
  position: absolute;
  inset: -30vmax;
  opacity: .55;
  mix-blend-mode: screen;
}
.sweep::before {
  background: conic-gradient(from 140deg at 50% 50%, transparent 0deg, rgba(125,249,255,.2) 34deg, transparent 76deg, rgba(255,79,216,.12) 148deg, transparent 210deg, rgba(124,255,178,.11) 286deg, transparent 360deg);
  animation: turn 28s linear infinite;
}
.sweep::after {
  background: radial-gradient(circle at 18% 22%, rgba(125,249,255,.2), transparent 28%), radial-gradient(circle at 82% 70%, rgba(255,79,216,.14), transparent 30%);
  filter: blur(22px);
  animation: breatheLight 8s ease-in-out infinite alternate;
}
.vignette {
  z-index: 8;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 48%, transparent 0, transparent 42%, rgba(1,2,7,.22) 62%, rgba(1,2,7,.86) 100%),
    linear-gradient(180deg, rgba(1,2,7,.68) 0%, transparent 22%, transparent 72%, rgba(1,2,7,.78) 100%);
}
.centerpiece {
  z-index: 4;
  display: grid;
  place-items: center;
  pointer-events: none;
  opacity: var(--heroFade);
  transform: translateY(calc(var(--shipReveal) * -16vh)) scale(calc(1 - var(--shipReveal) * .08));
  transition: opacity .12s linear;
}
.sigil-wrap {
  --tiltX: 0deg;
  --tiltY: 0deg;
  --coreScale: 1;
  width: min(76vmin, 720px);
  height: min(76vmin, 720px);
  opacity: .95;
  transform: translateY(3vmin);
  transform-style: preserve-3d;
  animation: coreFloat 5.6s ease-in-out infinite alternate;
}
#sigil {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter:
    drop-shadow(0 0 9px rgba(125,249,255,.82))
    drop-shadow(0 0 22px rgba(61,109,255,.45))
    drop-shadow(0 0 52px rgba(255,79,216,.24));
  transform-origin: 50% 50%;
  animation: spinCore 22s linear infinite;
}
#sigil .outer {
  animation: spinReverse 36s linear infinite;
  transform-origin: 50% 50%;
}
#sigil .inner {
  animation: spinCore 14s linear infinite;
  transform-origin: 50% 50%;
}
#sigil .pulse {
  transform-origin: 50% 50%;
  animation: pulseRing 2.9s ease-in-out infinite;
}
.copy {
  z-index: 6;
  pointer-events: none;
  display: grid;
  place-items: center;
  padding: 7vh 4vw 13vh;
  opacity: var(--heroFade);
  transform: translateY(calc(var(--shipReveal) * -10vh));
  transition: opacity .12s linear;
}
.title-stack {
  width: min(94vw, 1200px);
  text-align: center;
  transform: translateY(-8vmin);
}
h1 {
  margin: 0;
  min-height: 1.04em;
  font-size: clamp(4.4rem, 15.5vw, 12.8rem);
  line-height: .84;
  letter-spacing: 0;
  font-weight: 950;
  text-transform: uppercase;
  color: #f8fdff;
  text-shadow:
    0 0 4px rgba(255,255,255,.98),
    0 0 18px rgba(125,249,255,.92),
    0 0 48px rgba(61,109,255,.72),
    0 0 95px rgba(255,79,216,.38);
  filter: saturate(1.18);
}
h1 span {
  position: relative;
  display: inline-block;
  min-width: .58ch;
  transform-origin: 50% 70%;
  animation: glyphPulse 1.6s ease-in-out infinite;
}
h1 span:nth-child(2n) {
  animation-delay: .12s;
}
h1 span:nth-child(3n) {
  animation-delay: .24s;
}
.subtitle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .72rem;
  max-width: 100%;
  margin-top: clamp(1.1rem, 2.8vw, 2.2rem);
  padding: .56rem .86rem;
  border: 1px solid rgba(125,249,255,.26);
  background: rgba(3, 9, 22, .24);
  box-shadow: inset 0 0 26px rgba(125,249,255,.08), 0 0 34px rgba(61,109,255,.14);
  backdrop-filter: blur(10px);
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: clamp(.78rem, 1.55vw, 1.15rem);
  line-height: 1.2;
  color: rgba(216, 252, 255, .92);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0;
}
.subtitle::before,
.subtitle::after {
  content: "";
  width: .55rem;
  height: .55rem;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 9px var(--green), 0 0 24px rgba(124,255,178,.8);
  animation: beacon 1.4s ease-in-out infinite alternate;
  flex: 0 0 auto;
}
.subtitle::after {
  background: var(--pink);
  box-shadow: 0 0 9px var(--pink), 0 0 24px rgba(255,79,216,.76);
  animation-delay: .35s;
}
.jump-arrow {
  position: fixed;
  left: 50%;
  bottom: calc(clamp(48px, 7vh, 72px) + 3.4vh);
  z-index: 11;
  width: clamp(48px, 6vw, 68px);
  height: clamp(48px, 6vw, 68px);
  display: grid;
  place-items: center;
  border: 1px solid rgba(125,249,255,.34);
  border-radius: 50%;
  color: #dffcff;
  background: radial-gradient(circle at 50% 38%, rgba(125,249,255,.24), rgba(3,10,25,.42) 58%, rgba(1,2,7,.18));
  box-shadow: 0 0 18px rgba(125,249,255,.42), 0 0 48px rgba(61,109,255,.22), inset 0 0 18px rgba(125,249,255,.12);
  opacity: var(--heroFade);
  transform: translateX(-50%) translateY(calc(var(--shipReveal) * 24px));
  cursor: pointer;
  pointer-events: auto;
  backdrop-filter: blur(12px);
  animation: arrowFloat 1.55s ease-in-out infinite alternate;
}
.jump-arrow::before,
.jump-arrow::after {
  content: "";
  position: absolute;
  width: 34%;
  height: 34%;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: translateY(-14%) rotate(45deg);
  filter: drop-shadow(0 0 10px rgba(125,249,255,.9));
}
.jump-arrow::after {
  width: 20%;
  height: 20%;
  opacity: .56;
  transform: translateY(32%) rotate(45deg);
}
.jump-arrow:focus-visible {
  outline: 2px solid #7df9ff;
  outline-offset: 5px;
}
.hud {
  position: fixed;
  top: max(14px, 2.1vmin);
  left: max(14px, 2.1vmin);
  z-index: 9;
  display: flex;
  gap: .42rem;
  flex-wrap: wrap;
  max-width: min(92vw, 780px);
  pointer-events: none;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: clamp(.64rem, 1vw, .82rem);
  color: rgba(224, 253, 255, .84);
  text-transform: uppercase;
  letter-spacing: 0;
  opacity: calc(.38 + var(--heroFade) * .62);
}
.hud span {
  display: inline-flex;
  align-items: center;
  min-height: 1.9rem;
  padding: .34rem .54rem;
  border: 1px solid rgba(125,249,255,.25);
  background: rgba(2, 9, 24, .42);
  box-shadow: inset 0 0 18px rgba(125,249,255,.08), 0 0 18px rgba(61,109,255,.13);
  backdrop-filter: blur(12px);
}
.hud span:first-child {
  border-color: rgba(124,255,178,.38);
  color: rgba(216,255,233,.9);
}
.hud span:nth-child(3) {
  border-color: rgba(255,79,216,.34);
  color: rgba(255,222,249,.9);
}
.marquee {
  top: auto;
  z-index: 9;
  height: clamp(48px, 7vh, 72px);
  overflow: hidden;
  border-top: 1px solid rgba(125,249,255,.22);
  border-bottom: 1px solid rgba(255,79,216,.1);
  background:
    linear-gradient(90deg, rgba(1,2,7,.92), rgba(4,12,30,.7), rgba(1,2,7,.92)),
    linear-gradient(180deg, rgba(125,249,255,.08), transparent);
  box-shadow: 0 -18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  opacity: calc(.18 + var(--heroFade) * .82);
}
.marquee::before,
.marquee::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 18vw;
  z-index: 2;
  pointer-events: none;
}
.marquee::before {
  left: 0;
  background: linear-gradient(90deg, #010207, transparent);
}
.marquee::after {
  right: 0;
  background: linear-gradient(270deg, #010207, transparent);
}
.marquee-track {
  display: flex;
  align-items: center;
  width: max-content;
  height: 100%;
  animation: marquee 34s linear infinite;
}
.marquee-track span {
  flex: 0 0 auto;
  padding-inline: 1.1rem;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: clamp(.76rem, 1.35vw, 1rem);
  color: rgba(218, 253, 255, .88);
  text-shadow: 0 0 12px rgba(125,249,255,.85);
  white-space: nowrap;
  letter-spacing: 0;
}
.scanline {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: .14;
  background: repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(255,255,255,.14) 4px);
  mix-blend-mode: overlay;
}
.ship-deck {
  position: absolute;
  top: 100dvh;
  left: 0;
  z-index: 7;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: clamp(64px, 9vh, 120px) clamp(16px, 4vw, 72px) clamp(120px, 16vh, 190px);
  pointer-events: auto;
  opacity: var(--shipReveal);
  transform: translateY(calc((1 - var(--shipReveal)) * 12vh));
}
.ship-deck::before,
.ship-deck::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.ship-deck::before {
  background:
    radial-gradient(ellipse at 50% 48%, rgba(125,249,255,.19), transparent 23%),
    radial-gradient(ellipse at 50% 60%, rgba(255,79,216,.11), transparent 36%),
    linear-gradient(180deg, transparent 0, rgba(3,8,24,.42) 26%, rgba(1,2,7,.76) 100%);
  opacity: .9;
}
.ship-deck::after {
  background:
    linear-gradient(90deg, transparent 0 11%, rgba(125,249,255,.12) 11.15%, transparent 11.4% 88.6%, rgba(255,79,216,.1) 88.85%, transparent 89.1%),
    linear-gradient(180deg, transparent 0 18%, rgba(125,249,255,.08) 18.1%, transparent 18.35% 84%, rgba(124,255,178,.07) 84.15%, transparent 84.4%);
  filter: blur(.2px);
  opacity: .72;
}
.ship-stage {
  position: relative;
  width: min(96vw, 1320px);
  height: min(72vw, 760px);
  min-height: 420px;
  max-height: 78vh;
  display: grid;
  place-items: center;
  perspective: 1400px;
  isolation: isolate;
}
.ship-stage::before {
  content: "";
  position: absolute;
  width: 86%;
  height: 44%;
  left: 7%;
  top: 42%;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at center, rgba(125,249,255,.24), rgba(61,109,255,.08) 38%, transparent 71%),
    conic-gradient(from 0deg, transparent, rgba(125,249,255,.24), transparent, rgba(255,79,216,.16), transparent);
  filter: blur(16px);
  opacity: calc(.34 + var(--shipReveal) * .48);
  animation: dockHalo 7s linear infinite;
}
.ship-stage::after {
  content: "";
  position: absolute;
  width: 82%;
  height: 18%;
  left: 9%;
  bottom: 8%;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.9), rgba(0,0,0,.42) 45%, transparent 72%);
  filter: blur(18px);
  opacity: .78;
  transform: rotateX(74deg);
}
.ship-canvas {
  position: absolute;
  inset: -6% -4%;
  z-index: 3;
  width: 108%;
  height: 112%;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: calc(.18 + var(--shipReveal) * .82);
  filter:
    drop-shadow(0 0 16px rgba(125,249,255,.7))
    drop-shadow(0 0 48px rgba(61,109,255,.35));
}
.dock-ring {
  position: absolute;
  inset: 7% 9%;
  border: 1px solid rgba(125,249,255,.26);
  border-radius: 50%;
  transform: rotateX(68deg) rotateZ(calc(var(--shipRoll) * -1));
  box-shadow: 0 0 32px rgba(125,249,255,.22), inset 0 0 22px rgba(255,79,216,.12);
  opacity: .78;
  animation: ringPulse 3.8s ease-in-out infinite;
}
.dock-ring:nth-child(2) {
  inset: 14% 16%;
  border-color: rgba(255,79,216,.22);
  animation-delay: -.8s;
  transform: rotateX(68deg) rotateZ(calc(var(--shipRoll) * 1.25 + 42deg));
}
.dock-ring:nth-child(3) {
  inset: 21% 24%;
  border-color: rgba(124,255,178,.18);
  animation-delay: -1.6s;
  transform: rotateX(68deg) rotateZ(calc(var(--shipRoll) * -1.65 + 86deg));
}
.ship-model {
  position: relative;
  z-index: 2;
  width: min(90vw, 1140px);
  aspect-ratio: 16 / 8.8;
  transform-style: preserve-3d;
  transform:
    translateY(calc((1 - var(--shipReveal)) * 90px))
    rotateX(var(--shipTiltY))
    rotateY(var(--shipTiltX))
    rotateZ(var(--shipRoll))
    scale(calc(.86 + var(--shipReveal) * .14));
  filter:
    drop-shadow(0 0 18px rgba(125,249,255,.55))
    drop-shadow(0 0 46px rgba(61,109,255,.3))
    drop-shadow(0 0 84px rgba(255,79,216,.18));
  opacity: calc(.58 + (1 - var(--shipReveal)) * .32);
  transition: transform .1s linear;
}
.ship-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.ship-svg .hullGlow {
  animation: hullGlow 2.4s ease-in-out infinite alternate;
}
.ship-svg .engineFlame {
  transform-origin: 17% 50%;
  animation: flame 92ms linear infinite alternate;
  opacity: calc(.44 + var(--engineBoost) * .56);
}
.ship-svg .engineCore {
  animation: engineCore 1.1s ease-in-out infinite alternate;
}
.ship-svg .scanBeam {
  animation: shipScan 3.2s cubic-bezier(.65,0,.35,1) infinite;
}
.ship-svg .antenna {
  animation: antennaBlink 1.8s steps(2, end) infinite;
}
.ship-svg .micro {
  animation: microFlicker 2.4s linear infinite;
}
.ship-svg .micro:nth-of-type(2n) {
  animation-delay: -.8s;
}
.ship-svg .micro:nth-of-type(3n) {
  animation-delay: -1.4s;
}
.ship-sparks {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  mix-blend-mode: screen;
  background:
    radial-gradient(circle at 12% 48%, rgba(125,249,255,calc(.1 + var(--engineBoost) * .18)), transparent 11%),
    radial-gradient(circle at 19% 58%, rgba(255,79,216,calc(.08 + var(--engineBoost) * .12)), transparent 10%),
    linear-gradient(88deg, rgba(125,249,255,calc(.04 + var(--engineBoost) * .08)), transparent 22%);
  filter: blur(8px);
  animation: engineWake .32s linear infinite alternate;
}
@keyframes dockHalo {
  to { transform: rotate(360deg); }
}
@keyframes ringPulse {
  0%, 100% { opacity: .36; filter: blur(0); }
  50% { opacity: .86; filter: blur(.8px); }
}
@keyframes hullGlow {
  from { opacity: .62; }
  to { opacity: 1; }
}
@keyframes flame {
  from { transform: scaleX(.78) scaleY(.86); filter: blur(.4px); }
  to { transform: scaleX(1.22) scaleY(1.08); filter: blur(1.4px); }
}
@keyframes engineCore {
  from { opacity: .7; }
  to { opacity: 1; }
}
@keyframes engineWake {
  from { transform: translateX(-1.4%) scaleX(.92); opacity: .64; }
  to { transform: translateX(-3.2%) scaleX(1.08); opacity: 1; }
}
@keyframes shipScan {
  from { transform: translateX(-54%); opacity: 0; }
  16% { opacity: .76; }
  62% { opacity: .44; }
  to { transform: translateX(58%); opacity: 0; }
}
@keyframes antennaBlink {
  50% { opacity: .28; }
}
@keyframes microFlicker {
  0%, 92%, 100% { opacity: .72; }
  94% { opacity: .18; }
  96% { opacity: 1; }
}
@keyframes arrowFloat {
  from { box-shadow: 0 0 18px rgba(125,249,255,.42), 0 0 48px rgba(61,109,255,.22), inset 0 0 18px rgba(125,249,255,.12); }
  to { box-shadow: 0 0 28px rgba(125,249,255,.72), 0 0 72px rgba(61,109,255,.34), inset 0 0 26px rgba(125,249,255,.2); }
}
@keyframes sweep {
  0% { background-position: 135% 55%, -80% 30%; transform: translateX(-4vw) skewX(-8deg); }
  50% { background-position: -35% 55%, 160% 70%; transform: translateX(4vw) skewX(-8deg); }
  100% { background-position: -185% 55%, 320% 30%; transform: translateX(-4vw) skewX(-8deg); }
}
@keyframes turn {
  to { transform: rotate(360deg); }
}
@keyframes breatheLight {
  from { transform: scale(.95) rotate(-4deg); opacity: .36; }
  to { transform: scale(1.08) rotate(4deg); opacity: .68; }
}
@keyframes spinCore {
  to { transform: rotate(360deg); }
}
@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}
@keyframes pulseRing {
  0%, 100% { transform: scale(.92); opacity: .34; }
  50% { transform: scale(1.08); opacity: .96; }
}
@keyframes coreFloat {
  from { transform: perspective(900px) translateY(4vmin) rotateX(var(--tiltY)) rotateY(var(--tiltX)) scale(calc(.965 * var(--coreScale))); opacity: .82; }
  to { transform: perspective(900px) translateY(-1.5vmin) rotateX(var(--tiltY)) rotateY(var(--tiltX)) scale(calc(1.035 * var(--coreScale))); opacity: 1; }
}
@keyframes glyphPulse {
  0%, 100% { transform: translateY(0) scale(1); opacity: .92; }
  50% { transform: translateY(-.02em) scale(1.018); opacity: 1; }
}
@keyframes beacon {
  from { transform: scale(.72); opacity: .58; }
  to { transform: scale(1.18); opacity: 1; }
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
@keyframes gridDrift {
  to { background-position: 7.5vmin 7.5vmin, 7.5vmin 7.5vmin; }
}
@media (max-width: 700px) {
  .sigil-wrap {
    width: min(98vmin, 540px);
    height: min(98vmin, 540px);
    transform: translateY(7vmin);
  }
  .title-stack {
    transform: translateY(-12vmin);
  }
  h1 {
    font-size: clamp(4rem, 24vw, 7.2rem);
  }
  .subtitle {
    max-width: 92vw;
    gap: .48rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sweep,
  #sigil,
  #sigil .outer,
  #sigil .inner,
  #sigil .pulse,
  .sigil-wrap,
  .marquee-track,
  .grid,
  h1 span,
  .subtitle::before,
  .subtitle::after {
    animation-duration: 999s;
  }
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="grid"></div>
<div class="sweep"></div>
<div class="centerpiece" aria-hidden="true">
  <div class="sigil-wrap">
    <svg id="sigil" viewBox="0 0 600 600" role="img" aria-label="Rotating geometric signal">
      <defs>
        <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7df9ff"/>
          <stop offset="42%" stop-color="#3d6dff"/>
          <stop offset="72%" stop-color="#ff4fd8"/>
          <stop offset="100%" stop-color="#7cffb2"/>
        </linearGradient>
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
          <stop offset="34%" stop-color="#7df9ff" stop-opacity=".34"/>
          <stop offset="100%" stop-color="#3d6dff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="300" cy="300" r="64" fill="url(#coreGlow)" opacity=".9"/>
      <g id="geometry"></g>
    </svg>
  </div>

<script>

  const densityState = document.getElementById("densityState");
  const glitchState = document.getElementById("glitchState");
  const scaleState = document.getElementById("scaleState");
  const glyphs = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*+-/<=>?[]{}";
  const titleText = "WELCOME";
  const subtitleText = "DEEP SPACE RELAY // SIGNAL LOCKED // ENTER THE VOID";
  const marquee = [
    "ORBITAL RELAY ONLINE",
    "QUANTUM GATE OPEN",
    "NEBULA FIELD STABLE",
    "STARFORGE VECTOR SYNC",
    "DARK MATTER INDEX RISING",
    "HELIOSTATIC ARRAY ACTIVE",
    "COSMIC SIGNAL CLEAR",
    "GRAVITY LENS CALIBRATED",
    "PHOTON STREAM NOMINAL",
    "SINGULARITY EDGE MAPPED"
  ];
  let w = 0;
  let h = 0;
  let dpr = 1;
  let frame = 0;
  let last = performance.now();
  let particles = [];
  let dust = [];
  let columns = [];
  let trails = [];
  let ripples = [];
  let singularities = [];
  let comets = [];
  let fieldMode = "repel";
  let densityLevel = 1;
  let glitchBoost = 1;
  let coreScale = 1;
  let shipReveal = 0;
  let scrollVelocity = 0;
  let lastScrollY = scrollY;
  let wheelLocked = false;
  let shipDpr = 1;
  let shipW = 0;
  let shipH = 0;
  let shipFaces = [];
  let nebula = document.createElement("canvas");
  let nebulaCtx = nebula.getContext("2d");
  let mouse = {
    x: innerWidth * .5,
    y: innerHeight * .5,
    px: innerWidth * .5,
    py: innerHeight * .5,
    down: false,
    active: false,
    shift: false,
    lastMove: 0
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = s => s[(Math.random() * s.length) | 0];
  const TAU = Math.PI * 2;
  const rgb = (c, f, a) => `rgba(${clamp(c[0] * f, 0, 255)},${clamp(c[1] * f, 0, 255)},${clamp(c[2] * f, 0, 255)},${a})`;
  class Particle {
    constructor(i) {
      this.i = i;
      this.reset(true);
    }
    reset(anywhere) {
      this.x = anywhere ? Math.random() * w : rand(-40, w + 40);
      this.y = anywhere ? Math.random() * h : rand(-40, h + 40);
      this.vx = rand(-.16, .16);
      this.vy = rand(-.16, .16);
      this.r = rand(.75, 2.45);
      this.mass = rand(.65, 1.9);
      this.hue = rand(178, 325);
      this.energy = rand(.35, 1);
      this.seed = rand(0, 999);
    }
    update(t) {
      const idle = performance.now() - mouse.lastMove > 1900;
      const targetX = idle ? w * .5 + Math.cos(t * .00025) * w * .16 : mouse.x;
      const targetY = idle ? h * .5 + Math.sin(t * .00022) * h * .12 : mouse.y;
      const radius = mouse.down ? Math.min(w, h) * .48 : Math.min(w, h) * (mouse.shift ? .34 : .27);
      const dx = targetX - this.x;
      const dy = targetY - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < radius) {
        const fall = (1 - dist / radius) ** 2;
        const modeForce = fieldMode === "gravity" ? 1.18 : -1.15;
        const polarity = mouse.down ? 1.65 : idle ? .18 : mouse.shift ? -1.8 : modeForce;
        const force = fall * polarity / this.mass;
        this.vx += dx / dist * force;
        this.vy += dy / dist * force;
        this.vx += -dy / dist * fall * (mouse.down || fieldMode === "gravity" ? .62 : .16);
        this.vy += dx / dist * fall * (mouse.down || fieldMode === "gravity" ? .62 : .16);
      }
      for (const s of singularities) {
        const sx = s.x - this.x;
        const sy = s.y - this.y;
        const sd = Math.hypot(sx, sy) || 1;
        if (sd < s.radius) {
          const fall = (1 - sd / s.radius) ** 2 * s.life;
          this.vx += sx / sd * fall * s.pull;
          this.vy += sy / sd * fall * s.pull;
          this.vx += -sy / sd * fall * s.spin;
          this.vy += sx / sd * fall * s.spin;
        }
      }
      this.vx += Math.cos(t * .00033 + this.seed) * .008;
      this.vy += Math.sin(t * .00031 + this.seed * 1.7) * .008;
      this.vx *= .982;
      this.vy *= .982;
      const speed = Math.hypot(this.vx, this.vy);
      const max = mouse.down ? 4.8 : 3.1;
      if (speed > max) {
        this.vx = this.vx / speed * max;
        this.vy = this.vy / speed * max;
      }
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < -60) this.x = w + 60;
      if (this.x > w + 60) this.x = -60;
      if (this.y < -60) this.y = h + 60;
      if (this.y > h + 60) this.y = -60;
    }
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nebula.width = Math.floor(w * dpr);
    nebula.height = Math.floor(h * dpr);
    nebulaCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildNebula();
    const count = particleTarget();
    particles = Array.from({ length: count }, (_, i) => new Particle(i));
    dust = Array.from({ length: Math.floor(count * .42) }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      z: rand(.08, .82),
      hue: rand(180, 330),
      a: rand(.08, .34)
    }));
    columns = Array.from({ length: Math.ceil(w / 18) }, (_, i) => ({
      x: i * 18 + rand(-2, 2),
      y: rand(-h, 0),
      speed: rand(.45, 1.65),
      size: rand(11, 17),
      alpha: rand(.06, .22),
      drift: rand(-.04, .04)
    }));
    updateHud();
    updateScrollState();
    resizeShipCanvas(true);
  }
  function resizeShipCanvas(force) {
    const rect = shipCanvas.getBoundingClientRect();
    const nw = Math.max(1, Math.floor(rect.width));
    const nh = Math.max(1, Math.floor(rect.height));
    if (!force && nw === shipW && nh === shipH) return;
    shipDpr = Math.min(2, window.devicePixelRatio || 1);
    shipW = nw;
    shipH = nh;
    shipCanvas.width = Math.floor(shipW * shipDpr);
    shipCanvas.height = Math.floor(shipH * shipDpr);
    shipCtx.setTransform(shipDpr, 0, 0, shipDpr, 0, 0);
  }
  function particleTarget() {
    return clamp(Math.floor(w * h / 5200 * densityLevel), 260, 820);
  }
  function setDensity(next) {
    densityLevel = next;
    const target = particleTarget();
    if (particles.length < target) {
      const start = particles.length;
      for (let i = start; i < target; i++) particles.push(new Particle(i));
    } else if (particles.length > target) {
      particles.length = target;
    }
    particles.forEach((p, i) => p.i = i);
    updateHud();
  }
  function updateHud() {
    fieldState.textContent = "FIELD " + (fieldMode === "gravity" ? "GRAVITY" : "REPEL");
    densityState.textContent = "DENSITY " + densityLevel.toFixed(1);
    glitchState.textContent = "GLITCH " + glitchBoost.toFixed(1);
    scaleState.textContent = "CORE " + coreScale.toFixed(2);
    sigilWrap.style.setProperty("--coreScale", coreScale.toFixed(3));
  }
  function updateScrollState() {
    const y = scrollY || document.documentElement.scrollTop || 0;
    const dy = y - lastScrollY;
    lastScrollY = y;
    scrollVelocity = scrollVelocity * .82 + dy * .18;
    const start = h * .2;
    const end = h;
    shipReveal = clamp((y - start) / Math.max(1, end - start), 0, 1);
    const heroFade = clamp(1 - shipReveal * 1.18, 0, 1);
    const roll = Math.sin((y / Math.max(1, h)) * Math.PI) * 2.8 + scrollVelocity * .012;

      spawnComet(rect.left + rect.width * rand(.46, .88), rect.top + rect.height * rand(.18, .78), true);
    }
    const scanX = rect.left + rect.width * (.23 + Math.sin(t * .0011) * .18);
    const scanY = rect.top + rect.height * (.5 + Math.cos(t * .0013) * .16);
    if (frame % 5 === 0) addTrail(scanX, scanY, rand(-5, 5), rand(-5, 5), false);
  }
  function drawCursorField(t) {
    if (!mouse.active || performance.now() - mouse.lastMove > 900) return;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const radius = Math.min(w, h) * .32;
    const hue = fieldMode === "gravity" ? 142 : mouse.shift ? 325 : 188;
    const halo = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
    halo.addColorStop(0, `hsla(${hue}, 100%, 68%, .18)`);
    halo.addColorStop(.34, `hsla(${hue + 42}, 100%, 56%, .055)`);
    halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, radius, 0, TAU);
    ctx.fill();
    ctx.lineWidth = .8;
    for (let i = 0; i < particles.length; i += 3) {
      const p = particles[i];
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < radius) {
        const a = (1 - d / radius) ** 1.5;
        const mx = (p.x + mouse.x) * .5 + Math.sin(t * .003 + i) * 18;
        const my = (p.y + mouse.y) * .5 + Math.cos(t * .003 + i) * 18;
        ctx.strokeStyle = `hsla(${hue + a * 70}, 100%, 72%, ${a * .23})`;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.quadraticCurveTo(mx, my, p.x, p.y);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function addTrail(x, y, vx, vy, burst) {
    const n = burst ? 14 : 4;
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(vy, vx) + rand(-1.8, 1.8);
      const s = rand(.2, burst ? 4.2 : 2.2);
      trails.push({
        x: x + rand(-5, 5),
        y: y + rand(-5, 5),
        vx: Math.cos(a) * s + vx * .018,
        vy: Math.sin(a) * s + vy * .018,
        life: 1,
        decay: rand(.012, burst ? .034 : .026),
        size: rand(2, burst ? 9 : 6),
        hue: rand(176, 322)
      });
    }
    if (trails.length > 520) trails.splice(0, trails.length - 520);
  }
  function drawTrails() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = trails.length - 1; i >= 0; i--) {
      const s = trails[i];
      s.life -= s.decay;
      if (s.life <= 0) {
        trails.splice(i, 1);
        continue;
      }
      s.vx *= .986;
      s.vy *= .986;
      s.x += s.vx;
      s.y += s.vy;
      const r = s.size * s.life * 3.2;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
      g.addColorStop(0, `hsla(${s.hue}, 100%, 74%, ${.54 * s.life})`);
      g.addColorStop(.32, `hsla(${s.hue + 30}, 100%, 58%, ${.22 * s.life})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawLens(t) {
    const cx = w * .5 + Math.cos(t * .00019) * w * .055;
    const cy = h * .5 + Math.sin(t * .00023) * h * .048;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.translate(cx, cy);
    ctx.rotate(t * .00018);
    for (let i = 0; i < 5; i++) {
      const r = Math.min(w, h) * (.11 + i * .075);
      ctx.strokeStyle = `rgba(${i % 2 ? 255 : 125}, ${i % 2 ? 79 : 249}, ${i % 2 ? 216 : 255}, ${.11 - i * .014})`;
      ctx.lineWidth = 1.2 + i * .28;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.58, r * .52, i * .44, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
  function draw(t) {
    const dt = Math.min(40, t - last);
    last = t;
    frame++;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(1,2,7,.82)";
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.globalAlpha = .72 + Math.sin(t * .00018) * .12;
    ctx.drawImage(nebula, 0, 0, w, h);
    ctx.restore();
    drawDust(t);
    drawMatrix(t);
    drawLens(t);
    emitShipWake(t);
    drawRipples();
    drawSingularities();
    drawComets();
    drawParticles(t);
    drawCursorField(t);
    drawTrails();
    drawShipMesh(t);
    const fpsPulse = clamp(dt / 16.67, .55, 2.4);
    if (!mouse.active && frame % Math.floor(6 * fpsPulse) === 0) {
      addTrail(w * .5 + Math.cos(t * .0009) * w * .18, h * .5 + Math.sin(t * .0011) * h * .12, 0, 0, false);
    }
    requestAnimationFrame(draw);
  }
  function decodeInto(node, text, speed, hold) {
    node.innerHTML = "";
    const spans = Array.from(text, ch => {
      const span = document.createElement("span");
      span.textContent = ch === " " ? "\u00a0" : "";
      node.appendChild(span);
      return span;
    });
    let i = 0;
    function reveal() {
      if (i >= spans.length) return;
      const span = spans[i];
      const final = text[i];
      let tick = 0;
      const total = final === " " ? 1 : hold + Math.floor(Math.random() * hold);
      const jitter = () => {
        if (final === " ") {
          span.textContent = "\u00a0";
          i++;
          setTimeout(reveal, speed);
          return;
        }
        span.textContent = tick >= total ? final : pick(glyphs);
        span.style.color = tick >= total ? "" : `hsl(${rand(155, 315)}, 100%, 74%)`;
        span.style.textShadow = tick >= total ? "" : "0 0 18px currentColor, 0 0 42px currentColor";
        if (tick++ >= total) {
          span.style.color = "";
          span.style.textShadow = "";
          i++;
          setTimeout(reveal, speed);
        } else {
          requestAnimationFrame(jitter);
        }
      };
      jitter();
    }
    reveal();
  }
  function liveGlitch() {
    const spans = Array.from(headline.children);
    if (!spans.length) return;
    const amount = Math.max(1, Math.round((Math.random() > .78 ? 2 : 1) * glitchBoost));
    for (let i = 0; i < amount; i++) {
      const idx = (Math.random() * spans.length) | 0;
      const span = spans[idx];
      const original = titleText[idx];
      if (!original || original === " ") continue;
      span.textContent = pick(glyphs);
      span.style.color = `hsl(${rand(170, 315)}, 100%, 78%)`;
      setTimeout(() => {
        span.textContent = original;
        span.style.color = "";
      }, rand(45, 120));
    }
    setTimeout(liveGlitch, rand(850, 2200) / glitchBoost);
  }
  function buildGeometry() {
    const ns = "http://www.w3.org/2000/svg";
    const make = (name, attrs, parent = geometry) => {
      const el = document.createElementNS(ns, name);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      parent.appendChild(el);
      return el;
    };
    const group = make("g", { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" });
    const outer = make("g", { class: "outer" }, group);
    const inner = make("g", { class: "inner" }, group);
    const pulse = make("g", { class: "pulse" }, group);
    const polyPoints = (n, r, rot = 0) => Array.from({ length: n }, (_, i) => {
      const a = rot + i / n * TAU - Math.PI / 2;
      return `${300 + Math.cos(a) * r},${300 + Math.sin(a) * r}`;
    }).join(" ");
    [258, 222, 178, 126].forEach((r, i) => {
      make("polygon", { points: polyPoints(6 + i * 2, r, i * .13), stroke: "url(#edge)", "stroke-width": 1.4 + i * .22, opacity: .42 + i * .1 }, i % 2 ? inner : outer);
    });
    [286, 242, 202, 154, 92].forEach((r, i) => {
      make("circle", { cx: 300, cy: 300, r, stroke: "url(#edge)", "stroke-width": i === 0 ? 1 : .72, opacity: .13 + i * .075 }, i < 2 ? pulse : group);
    });
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * TAU;
      const r1 = i % 3 === 0 ? 78 : 118;
      const r2 = i % 2 === 0 ? 286 : 236;
      make("line", {
        x1: 300 + Math.cos(a) * r1,
        y1: 300 + Math.sin(a) * r1,
        x2: 300 + Math.cos(a) * r2,
        y2: 300 + Math.sin(a) * r2,
        stroke: "url(#edge)",
        "stroke-width": i % 6 === 0 ? 1.1 : .55,
        opacity: i % 6 === 0 ? .46 : .2
      }, i % 2 ? outer : inner);
    }
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * TAU + .12;
      const b = a + TAU / 6;
      const c = a + TAU / 3;
      const pts = [
        `${300 + Math.cos(a) * 74},${300 + Math.sin(a) * 74}`,
        `${300 + Math.cos(b) * 198},${300 + Math.sin(b) * 198}`,
        `${300 + Math.cos(c) * 122},${300 + Math.sin(c) * 122}`
      ].join(" ");
      make("polyline", { points: pts, stroke: i % 2 ? "#7df9ff" : "#ff4fd8", "stroke-width": .72, opacity: .24 }, inner);
    }
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU;
      const x = 300 + Math.cos(a) * 302;
      const y = 300 + Math.sin(a) * 302;
      make("circle", { cx: x, cy: y, r: i % 3 === 0 ? 4.5 : 2.7, fill: i % 2 ? "#ff4fd8" : "#7df9ff", opacity: .72 }, pulse);
    }
    make("polygon", { points: polyPoints(3, 88, Math.PI), stroke: "#ffffff", "stroke-width": 1.2, opacity: .68 }, group);
    make("polygon", { points: polyPoints(3, 88, 0), stroke: "#7cffb2", "stroke-width": 1.2, opacity: .58 }, group);
  }
  function buildMarquee() {
    const text = marquee.map(v => `${v} //`).join(" ");
    for (let i = 0; i < 2; i++) {
      const span = document.createElement("span");
      span.textContent = text;
      marqueeTrack.appendChild(span);
    }
  }
  addEventListener("resize", resize, { passive: true });
  addEventListener("scroll", updateScrollState, { passive: true });
  jumpArrow.addEventListener("click", () => {
    addRipple(w * .5, h * .82, 1.25, 188);
    goToPage(1);
  });
  addEventListener("pointermove", e => {
    mouse.active = true;
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.shift = e.shiftKey;
    mouse.lastMove = performance.now();
    const nx = (mouse.x / w - .5) * 2;
    const ny = (mouse.y / h - .5) * 2;
    sigilWrap.style.setProperty("--tiltX", (nx * 10).toFixed(2) + "deg");
    sigilWrap.style.setProperty("--tiltY", (-ny * 10).toFixed(2) + "deg");
    document.body.style.setProperty("--shipTiltX", (nx * (shipReveal > .3 ? 14 : 7)).toFixed(2) + "deg");
    document.body.style.setProperty("--shipTiltY", (-ny * (shipReveal > .3 ? 9 : 4)).toFixed(2) + "deg");
    addTrail(mouse.x, mouse.y, mouse.x - mouse.px, mouse.y - mouse.py, false);
  }, { passive: true });
  addEventListener("pointerdown", e => {
    mouse.down = true;
    mouse.shift = e.shiftKey;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.lastMove = performance.now();
    addTrail(mouse.x, mouse.y, 0, 0, true);
    addRipple(mouse.x, mouse.y, 1.45, rand(175, 320));
    for (let i = 0; i < 4; i++) spawnComet(mouse.x, mouse.y, false);
    updateScrollState();
  }, { passive: true });
  addEventListener("pointerup", e => {
    mouse.down = false;
    addTrail(e.clientX, e.clientY, 0, 0, true);
    addRipple(e.clientX, e.clientY, 1.1, rand(175, 320));
    updateScrollState();
  }, { passive: true });
  addEventListener("dblclick", e => {
    addSingularity(e.clientX, e.clientY);
  }, { passive: true });
  addEventListener("wheel", e => {
    e.preventDefault();
    if (wheelLocked || Math.abs(e.deltaY) < 8) return;
    const target = e.deltaY > 0 ? 1 : 0;
    if ((target === 1 && scrollY < h * .5) || (target === 0 && scrollY > h * .5)) {
      wheelLocked = true;
      addRipple(mouse.x, mouse.y, 1.05, target ? 188 : 288);
      goToPage(target);
      setTimeout(() => {
        wheelLocked = false;
      }, 850);
    }
  }, { passive: false });
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.code === "Space") {
      e.preventDefault();
      fieldMode = fieldMode === "gravity" ? "repel" : "gravity";
      updateHud();
      addRipple(mouse.x, mouse.y, 1.8, fieldMode === "gravity" ? 142 : 196);
    }
    if (k === "d") setDensity(densityLevel >= 1.8 ? .8 : densityLevel + .5);
    if (k === "x") {
      glitchBoost = glitchBoost >= 3 ? 1 : glitchBoost + .5;
      updateHud();
      addRipple(mouse.x, mouse.y, 1.2, 305);
    }
    if (k === "c") {
      for (let i = 0; i < 16; i++) spawnComet(mouse.x, mouse.y, true);
      addRipple(mouse.x, mouse.y, 1.35, 198);
    }
    if (k === "g") addSingularity(mouse.x, mouse.y);
    if (k === "+" || k === "=") {
      coreScale = clamp(coreScale + .06, .72, 1.58);
      updateHud();
      addRipple(mouse.x, mouse.y, .82, 148);
    }
    if (k === "-" || k === "_") {
      coreScale = clamp(coreScale - .06, .72, 1.58);
      updateHud();
      addRipple(mouse.x, mouse.y, .82, 285);
    }
    if (e.key === "ArrowDown" || e.key === "PageDown") {
      e.preventDefault();
      goToPage(1);
    }
    if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "Home") {
      e.preventDefault();
      goToPage(0);
    }
  });
  addEventListener("keyup", e => {
    mouse.shift = e.shiftKey;
  });
  addEventListener("pointerleave", () => {
    mouse.active = false;
    mouse.down = false;
  }, { passive: true });
  buildGeometry();
  buildShipMesh();
  buildMarquee();
  resize();
  updateScrollState();
  decodeInto(headline, titleText, 48, 8);
  setTimeout(() => decodeInto(subtitle, subtitleText, 12, 3), 520);
  setTimeout(liveGlitch, 3200);
  requestAnimationFrame(draw);
})();
</script>
